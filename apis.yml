description: Ancora Biotech is a clinical-stage biopharmaceutical company developing breakthrough
  biotherapeutics for B cell cancers, metabolic diseases, and chronic hepatitis B infection. Formed
  by former Teneobio executives and venture investors, it oversees three therapeutic programs across
  separate spinoffs — TeneoTwo (TNB-486, a T cell engager in Phase I for B-cell malignancies),
  TeneoFour (TNB-738, an anti-CD38 antibody for inflammatory and metabolic disorders), and TeneoTen
  (an anti-HBV T cell engager for hepatitis B). It is a drug-development company with no public
  developer API or platform surface.
